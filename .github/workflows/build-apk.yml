name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true
      - name: حفظ main.dart الأصلي
        run: cp lib/main.dart /tmp/main_backup.dart
      - name: مسح أندرويد القديم
        run: rm -rf android
      - name: إنشاء أندرويد جديد v2
        run: flutter create . --platforms android --org com.ottoman.game --project-name ottoman_empire_1800
      - name: إرجاع لعبتك
        run: cp /tmp/main_backup.dart lib/main.dart
      - run: flutter pub get
      - run: flutter build apk --release --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: ottoman-apk
          path: build/app/outputs/flutter-apk/app-release.apk
